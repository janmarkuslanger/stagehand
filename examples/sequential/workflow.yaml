name: "Haiku Pipeline"
version: "1"

output:
  backend: filesystem
  path: ./output

agents:
  writer:
    role: "Haiku writer and critic"
    system_prompt: |
      You are a concise haiku writer. You write and refine haiku poetry.
      When asked to write, produce exactly one haiku (5-7-5 syllables).
      When asked to refine, improve the haiku and explain the change in one sentence.
      Always use the write_file tool to save your work.
    model: qwen2.5
    executor: ollama
    tools:
      - write_file

tasks:
  draft:
    agent: writer
    prompt: "Write a haiku about the ocean at dawn. Save it to draft.md."
    outputs:
      - draft.md

  refine:
    agent: writer
    depends_on: [draft]
    prompt: |
      Here is the draft haiku:

      {{ tasks.draft }}

      Refine it to be more vivid. Save the final version to final.md.
    outputs:
      - final.md
