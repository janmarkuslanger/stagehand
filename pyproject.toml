[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "stagehand-ai"
dynamic = ["version"]
description = "Asyncio DAG workflow engine for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["."]
include = ["stagehand*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
